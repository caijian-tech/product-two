<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 심플 블로그</title>
    <!-- Version 1.0.1 - Sophisticated Blog UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">首頁</a></li>
                    <li><a href="forum.html">论坛</a></li>
                    <li><a href="news.html">亲子</a></li>
                    <li><a href="business.html">美食</a></li>
                    <li><a href="guide.html">淘宝</a></li>
                    <li><a href="ranking.html">排行</a></li>
                </ul>
            </nav>
            <div class="exchange-rate" id="exchange-rate">
                <span class="rate-label">USD/KRW</span>
                <span class="rate-value">--</span>
            </div>
            <h1>나의 심플 블로그</h1>
            <p>당신의 생각과 아이디어를 세상과 공유하세요.</p>
        </header>

        <section class="create-post">
            <div class="card">
                <h2>새 글 작성하기</h2>
                <form id="post-form">
                    <select id="post-category" required>
                        <option value="" disabled selected>카테고리 선택</option>
                        <option value="미식">미식</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="드라이브">드라이브</option>
                    </select>
                    <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
                    <textarea id="post-content" rows="4" placeholder="어떤 생각을 하고 계신가요??" required></textarea>
                    <button type="submit">게시하기</button>
                </form>
            </div>
        </section>

        <section class="blog-feed">
            <h2>최근 게시물</h2>
            <div id="posts-container">
                <!-- Posts will be injected here by JavaScript -->
            </div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
